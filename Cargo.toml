[package]
name = "copain_t"
version = "0.1.0"
edition = "2021"
description = "Real-time AI 2D ink sketching & interactive 3D visual rendering — inline on a canvas or floating over any desktop app."

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
base64 = "0.22"
dotenvy = "0.15"
tray-icon = "0.19"
